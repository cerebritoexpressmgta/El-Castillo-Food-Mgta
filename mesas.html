<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Castillo Food Mgta - Mesas</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA: app del personal -->
    <link rel="manifest" href="/manifest-personal.webmanifest">
    <meta name="theme-color" content="#0b1220">
    <meta name="apple-mobile-web-app-title" content="Castillo Staff">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="pwa.js" defer></script>
    <link rel="stylesheet" href="fondos.css?v=3">
    <script src="seguridad.js?v=1" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans" data-fondo="mesas">

    <header class="bg-slate-800 border-b border-slate-700 px-4 md:px-6 py-3 shadow-lg">
        <div class="max-w-[98%] mx-auto flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <span class="text-3xl" data-marca="emoji">🍔</span>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white">Mesas del local</h1>
                    <p class="text-xs text-slate-400"><span data-marca="nombre">El Castillo Food Mgta</span> · plano en vivo</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <span id="chip-libres" class="text-xs font-bold px-3 py-1.5 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">0 libres</span>
                <span id="chip-ocupadas" class="text-xs font-bold px-3 py-1.5 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">0 ocupadas</span>
                <span id="chip-cuenta" class="text-xs font-bold px-3 py-1.5 rounded-full bg-fuchsia-500/15 text-fuchsia-300 border border-fuchsia-500/30">0 piden la cuenta</span>
                <a href="cocina.html" class="bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold h-10 px-4 rounded-lg flex items-center gap-2 transition"><i class="fa-solid fa-table-columns"></i> Tablero</a>
                <a href="menu_trabajadores.html" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold h-10 px-4 rounded-lg flex items-center gap-2 transition"><i class="fa-solid fa-plus"></i> Nuevo pedido</a>
            </div>
        </div>
        <div id="filtro-zonas" class="max-w-[98%] mx-auto mt-3 flex flex-wrap gap-2"></div>
    </header>

    <main class="flex-1 p-4 md:p-6 max-w-[98%] w-full mx-auto">
        <div id="grid-mesas" class="grid gap-3 grid-cols-2 md:grid-cols-3 xl:grid-cols-5"></div>
        <p id="vacio" class="hidden text-center text-slate-400 py-16">No hay mesas todavía. Agrégalas en Administración → Mesas.</p>
        <div class="mt-6 flex flex-wrap gap-4 text-xs text-slate-400">
            <span><span class="inline-block w-3 h-3 rounded bg-emerald-500 mr-1"></span>Libre</span>
            <span><span class="inline-block w-3 h-3 rounded bg-amber-500 mr-1"></span>Ocupada (consumiendo)</span>
            <span><span class="inline-block w-3 h-3 rounded bg-fuchsia-500 mr-1"></span>Pidió la cuenta</span>
        </div>
    </main>

    <!-- Cuenta de una mesa -->
    <div id="modal-mesa" class="hidden fixed inset-0 z-50 bg-black/70 items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl">
            <div class="flex items-start justify-between p-5 border-b border-slate-700">
                <div>
                    <h2 id="mm-titulo" class="text-xl font-bold text-white"></h2>
                    <p id="mm-sub" class="text-xs text-slate-400 mt-0.5"></p>
                </div>
                <button onclick="cerrarModalMesa()" class="text-slate-400 hover:text-white text-xl leading-none px-2" aria-label="Cerrar">✕</button>
            </div>
            <div id="mm-pedidos" class="p-5 overflow-y-auto space-y-3 flex-1"></div>
            <div class="p-5 border-t border-slate-700 space-y-3">
                <div class="flex items-end justify-between">
                    <span class="text-sm text-slate-400">Total de la cuenta</span>
                    <div class="text-right"><div id="mm-total" class="text-2xl font-black text-emerald-400">$0.00</div><div id="mm-total-bs" class="text-xs text-amber-400 font-semibold"></div></div>
                </div>
                <div id="mm-botones" class="grid grid-cols-2 gap-2"></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="demo-config.js"></script>
    <script src="api-cliente.js"></script>
    <script src="mesas.js"></script>
    <script src="menu-dueno.js"></script>
    <script src="mi-horario.js?v=1"></script>
</body>
</html>
